  <rect x="96" y="304" width="150" height="34" rx="17" fill="#ffffff" fill-opacity=".38"/>
  <rect x="96" y="364" width="210" height="34" rx="17" fill="#ffffff" fill-opacity=".38"/>
  <!-- Upright Vivid Blue plus -->
  <path d="M374 264h38v62h62v38h-62v62h-38v-62h-62v-38h62z" fill="#00b2e3"/>
  <!-- Signature blue line -->
  <rect x="0" y="452" width="512" height="18" fill="#00b2e3"/>
