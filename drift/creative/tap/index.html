<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift Tap Timing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column like a phone video frame — controls up top, the line being sung in the middle, a big tap pad at the bottom. Dark only: it's the video's palette. */
:root { --bg:#0b0a09; --panel:#151310; --line:#2a2723; --ink:#efede9; --muted:#8d877e; --stone:#c4b6a2; --hot:#fff4e6;
  --display:"Bebas Neue","Oswald","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; color-scheme:dark; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 var(--body); }
.app { height:100%; padding-top:env(safe-area-inset-top,0px); display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:minmax(0,1fr); max-width:560px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
header { padding-block:14px 8px; display:grid; gap:10px; grid-template-columns:minmax(0,1fr); min-width:0; }
main { min-width:0; }
.title { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
h1 { font:400 30px/1 var(--display); letter-spacing:.03em; margin:0; }
.count { font:12px var(--mono); color:var(--muted); }
.controls { display:flex; flex-wrap:wrap; gap:8px; }
[hidden] { display:none !important; }
select { flex:1 1 100%; min-width:0; max-width:100%; }
button, select { font:500 14px var(--body); color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:9px 12px; }
button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
button:focus-visible, select:focus-visible { outline:2px solid var(--stone); outline-offset:2px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button { border:0; border-radius:0; padding:9px 10px; }
.seg button[aria-pressed="true"] { background:var(--stone); color:var(--bg); }
.help { font-size:13px; color:var(--muted); }
main { overflow:hidden; display:grid; align-content:center; gap:18px; padding-block:10px; }
.sec { font:500 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--stone); }
.lyric { display:flex; flex-wrap:wrap; gap:6px 12px; font:400 44px/1.02 var(--display); letter-spacing:.02em; }
.lyric.next { font-size:22px; color:var(--muted); opacity:.7; }
.word { display:inline-flex; gap:2px; }
.syl { padding:0 2px; border-radius:4px; color:rgba(239,237,233,.28); transition:color .08s; }
.syl.done { color:var(--ink); }
.syl.held { color:var(--stone); }
.syl.target { color:var(--bg); background:var(--hot); }
.syl.live { color:var(--hot); }
.time { font:12px var(--mono); color:var(--muted); }
.pad { margin-block:8px max(14px, env(safe-area-inset-bottom,0px)); height:min(30vh,220px); border-radius:14px; border:1px solid var(--line); background:var(--panel); display:grid; place-items:center; text-align:center; user-select:none; touch-action:none; cursor:pointer; }
.pad.down { background:#2a2622; border-color:var(--stone); }
.pad strong { font:400 40px/1 var(--display); letter-spacing:.04em; display:block; }
.pad span { font-size:13px; color:var(--muted); }
.out { display:grid; gap:8px; padding-block:6px; }
.out textarea { width:100%; height:110px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; font:11px var(--mono); padding:8px; }
@media (prefers-reduced-motion: reduce) { .syl { transition:none; } }
</style>
</head>

<div class="app">
  <header>
    <div class="title"><h1>Drift · tap timing</h1><span class="count" id="count">0 / 0</span></div>
    <div class="controls">

      <button id="copy" type="button">Copy my timing</button>
    </div>
    <p class="help">Press the pad the moment each highlighted syllable starts. On a held note, keep holding until the note ends. Made a mistake? Tap “Back a line”. Your taps save in this browser.</p>

LINES.forEach((l, li) => { const o = document.createElement("option"); o.value = li; o.textContent = `${l.sec} · ${l.w.map((w) => w.map((s) => s[0]).join("")).join(" ").slice(0, 34)}`; startSel.appendChild(o); });
const lineStart = (li) => LINES[li].w[0][0][1];
const fmt = (x) => `${Math.floor(x / 60)}:${(x % 60).toFixed(1).padStart(4, "0")}`;
function render() {
  const cur = flat[Math.min(target, flat.length - 1)], li = cur ? cur.li : 0;
  $("sec").textContent = LINES[li].sec;
  const lineHTML = (L, k) => LINES[L].w.map((w, wi) => `<span class="word">${w.map((s, si) => {
    const sid = `${L}.${wi}.${si}`, tp = taps[sid], isT = flat[target] && flat[target].li === L && flat[target].wi === wi && flat[target].si === si;
    return `<span class="syl ${isT ? (downAt !== null ? "live" : "target") : tp ? (tp[1] - tp[0] > 0.4 ? "held done" : "done") : ""}">${s[0]}</span>`; }).join("")}</span>`).join("");
  $("cur").innerHTML = lineHTML(li);
  $("nxt").innerHTML = li + 1 < LINES.length ? lineHTML(li + 1) : "";
  $("count").textContent = `${Object.keys(taps).length} / ${flat.length}`;
  $("padWord").textContent = flat[target] ? flat[target].t : "DONE";
  startSel.value = li;
}
function setTrack(tr) { const t0 = A().currentTime, playing = !A().paused; A().pause(); track = tr; A().currentTime = t0; A().playbackRate = rate; if (playing) A().play(); document.querySelectorAll("[data-track]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.track === tr)); }
document.querySelectorAll("[data-track]").forEach((b) => b.addEventListener("click", () => setTrack(b.dataset.track)));
document.querySelectorAll("[data-rate]").forEach((b) => b.addEventListener("click", () => { rate = +b.dataset.rate; A().playbackRate = rate; document.querySelectorAll("[data-rate]").forEach((x) => x.setAttribute("aria-pressed", x === b)); }));
$("play").addEventListener("click", () => { const a = A(); a.playbackRate = rate; if (a.paused) { if (a.currentTime < 1 && flat[target]) a.currentTime = Math.max(0, lineStart(flat[target].li) - 2.5); a.play(); $("play").textContent = "Pause"; } else { a.pause(); $("play").textContent = "Play"; } });
function goLine(li) { flat.forEach((s, i) => { if (s.li >= li) delete taps[id(s)]; }); save(); target = flat.findIndex((s) => s.li === li); const a = A(); a.currentTime = Math.max(0, lineStart(li) - 2.5); render(); }
$("back").addEventListener("click", () => { const li = flat[Math.min(target, flat.length - 1)].li; goLine(Math.max(0, li - (flat[target] && flat[target].si === 0 && flat[target].wi === 0 ? 1 : 0))); });
startSel.addEventListener("change", () => goLine(+startSel.value));
function press() { if (!flat[target] || downAt !== null) return; downAt = A().currentTime; $("pad").classList.add("down"); render(); }
function release() { if (downAt === null) return; const s = flat[target]; taps[id(s)] = [+downAt.toFixed(3), +A().currentTime.toFixed(3)]; save(); downAt = null; target++; $("pad").classList.remove("down"); render(); }
const pad = $("pad");
pad.addEventListener("pointerdown", (e) => { e.preventDefault(); pad.setPointerCapture(e.pointerId); press(); });
pad.addEventListener("pointerup", release); pad.addEventListener("pointercancel", release);
document.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat) { e.preventDefault(); press(); } });
document.addEventListener("keyup", (e) => { if (e.code === "Space") { e.preventDefault(); release(); } });
$("copy").addEventListener("click", (ev) => {
  const rows = flat.filter((s) => taps[id(s)]).map((s) => `${id(s)} ${taps[id(s)][0]} ${taps[id(s)][1]}`);
  const text = `DRIFT-TAPS v1 (${rows.length})\n` + rows.join("\n");
  const out = $("out"); out.value = text; $("outBox").hidden = false;
  const btn = ev.currentTarget, done = (m) => { btn.textContent = m; setTimeout(() => (btn.textContent = "Copy my timing"), 2200); };
  try { navigator.clipboard.writeText(text).then(() => done("Copied"), () => { out.select(); done("Select and copy below"); }); } catch (e) { out.select(); done("Select and copy below"); }
});
(function tick() { $("time").textContent = fmt(A().currentTime); requestAnimationFrame(tick); })();
render();
</script>

</body>
</html>
