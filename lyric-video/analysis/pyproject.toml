[project]
name = "analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "audioread>=3.0",
    "demucs>=4.0.1",
    "faster-whisper>=1.1.0",
    "fonttools>=4.50",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "numba>=0.59",
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "soxr>=0.3",
    "torch>=2.3",
    "torchaudio>=2.3",
]

# Linux/CPU container: CPU-only torch wheels (the CUDA wheels are several GB).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
