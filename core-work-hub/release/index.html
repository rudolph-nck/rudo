 on time: P1 within an hour and hourly, P2 the same day and daily, P3 and P4 within a business day.`,howTo:[{task:`Clear a notification`,steps:[`Comment on the ticket in Service Desk; the hub sees it on the next sync.`,`Or press Log update to record it now and copy a ready-made message.`]},{task:`Know what happens if it is missed`,steps:[`It goes to you first, then to whoever is on support after a business day, then to Nick.`]}],tour:[{view:`notifications`,target:`.page-head h1`,title:`Notifications`,body:`Tickets owed a first response, an update, or a requester follow-up.`},{view:`notifications`,target:`.notice`,title:`A notice`,body:`What is due, when, and who should act. Red means late or escalated.`},{view:`notifications`,target:`text:Log update`,title:`Log update`,body:`Record the update and copy wording you can paste into Service Desk.`}]},{id:`intake`,title:`Intake: grading new work`,minutes:4,audience:`support`,why:`Every new ticket and project gets a bucket, impact, urgency and effort, which become its priority, score and place in line.`,howTo:[{task:`Grade a ticket`,steps:[`Open Intake and select a ticket.`,`Pick the bucket, then impact, urgency and effort (hover any number to see what it means).`,`Check the suggested priority and owner, then Send to To Do.`]},{task:`Go faster`,steps:[`J / K move between tickets, 1–4 set priority, Enter sends, O opens it in Service Desk.`]}],tour:[{view:`triage`,target:`.page-head h1`,title:`Intake`,body:`Everything waiting to be graded. Whoever is on support grades during their shift.`},{view:`triage`,target:`.q-item.sel`,title:`The selected ticket`,body:`Pick a bucket and rate impact, urgency and effort. Hover a number to see what it means.`},{view:`triage`,target:`text:Send to To Do`,title:`Send it on`,body:`It joins the ranked To Do list for its bucket.`}]},{id:`standup`,title:`Daily stand-up`,minutes:4,audience:`support`,why:`One agenda so nothing big or small slips: P1s, what is due today, what is past target, and wh .`]},{task:`Plan time off`,steps:[`Nick adds time off on the Time off page and picks who covers your work while you are out.`]}],tour:[{view:`rotation`,target:`.page-head h1`,title:`Rotation`,body:`Who is on support now, next, and the running order.`},{view:`timeoff`,target:`.page-head h1`,title:`Time off`,body:`Who is out and who is covering. Owner suggestions skip anyone who is off.`}]},{id:`team`,title:`Team load and Overview`,minutes:3,audience:`manager`,why:`Each person’s load against their WIP limit and their level’s time split, and how work is moving overall.`,howTo:[{task:`Check someone’s load`,steps:[`Open Team: Doing against their limit, queue, overdue updates, and hours against their split (support-week split during their shift).`]},{task:`See the big picture`,steps:[`Overview: open vs closed, what is held up, cycle time, and team load. Export CSVs for Power BI.`]}],tour:[{view:`team`,target:`.team-row`,title:`One row per person`,body:`Doing vs limit, queue, overdue updates, and hours vs their level’s time split.`},{view:`overview`,target:`.hero`,title:`Overview`,body:`How work is moving, where it is held up, and each person’s load.`}]},{id:`settings`,title:`Settings (Nick)`,minutes:4,audience:`manager`,why:`The priority standard, WIP limits and levels, the time split, the ownership map, and ticket data.`,howTo:[{task:`Change a target`,steps:[`Settings → Priority standard: response, updates and target to resolve per priority, the start date and the backlog goal.`]},{task:`Set limits and levels`,steps:[`Settings → WIP limits: level and Doing limits per person, plus team bucket limits.`,`Weekly time split by level: hours per bucket for senior, mid, junior and support week.`]},{task:`Update the ownership map`,steps:[`Settings → Ownership map: primary, secondary and third owners and criticality per system.`]}],tour:[{view:`settings`,target:`#ps-h`,title:`Priority standard`,body:`Targets per priority, the start date, and the backlog goal.`},{view:`settings`,ta
